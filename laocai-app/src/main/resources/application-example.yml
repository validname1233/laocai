spring:
  application:
    name: laocai
  jackson:
    property-naming-strategy: SNAKE_CASE
  main:
    web-application-type: none
    keep-alive: true
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      api-key: replace-with-your-key
      base-url: https://api.siliconflow.cn/v1
      chat:
        model: deepseek-v4-flash
    deepseek:
      api-key: replace-with-your-key
      base-url: https://api.deepseek.com/v1
      chat:
        model: deepseek-v4-flash
    
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %highlight(%5p) %clr([%t]){magenta} %clr(%-40.40logger{39}){cyan} %clr(>){faint} %m%n"

redis:
  host: localhost
  port: 6379
  password: replace-with-your-redis-password

laocai:
  milky:
    enabled: true
    url: http://llbot:3010
    access-token: replace-with-your-token
  dispatcher:
    concurrency: 32
    buffer-size: 5000
embabel:
  agent:
    platform:
      models:
        openai:
          # Embabel uses its own namespace; reuse the Spring AI OpenAI-compatible endpoint.
          api-key: ${spring.ai.openai.api-key}
          base-url: ${spring.ai.openai.base-url}
