name: Build and Deploy Laocai

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/laocai
  JAR_NAME: laocai-app-0.0.1-SNAPSHOT.jar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :laocai-app:bootJar

      - name: Upload JAR to server
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SERVER_PORT }}" \
              laocai-app/build/libs/${{ env.JAR_NAME }} \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Restart application
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.SERVER_PORT }}" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cd '${{ env.DEPLOY_DIR }}' && \
               pkill -f '${{ env.JAR_NAME }}' || true && \
               sleep 2 && \
               nohup java -jar ${{ env.JAR_NAME }} > app.log 2>&1 &"

      - name: Check service status
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.SERVER_PORT }}" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "sleep 3 && ps aux | grep '${{ env.JAR_NAME }}' | grep -v grep && \
               tail -20 '${{ env.DEPLOY_DIR }}/app.log'"
