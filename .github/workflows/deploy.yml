name: Build and Deploy Laocai

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/laocai # 服务器上的部署目录，首次需手动创建并放好 application.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          # --delete 保持服务器目录与仓库一致；--exclude 的文件不会被删除，
          # 保护服务器上仓库之外的运行时文件（配置、llbot 数据）
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'application.yml' \
            --exclude 'llbot_config' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }}" \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/"

      - name: Build and start services
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.SERVER_PORT }}" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cd '${{ env.DEPLOY_DIR }}' \
               && docker compose up -d --build \
               && docker image prune -f"

      - name: Check service status
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.SERVER_PORT }}" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cd '${{ env.DEPLOY_DIR }}' \
               && docker compose ps \
               && docker compose logs --tail 30 springboot"
