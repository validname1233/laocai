name: Build and Deploy Laocai

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build Spring Boot jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: Normalize jar name
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          echo "Found jar: $JAR_FILE"
          cp "$JAR_FILE" app.jar
          ls -lh app.jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar to WSL
        run: |
          scp -i ~/.ssh/deploy_key \
              -P "${{ secrets.SERVER_PORT }}" \
              app.jar \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/laocai-${{ github.sha }}.jar"

      - name: Deploy on WSL
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.SERVER_PORT }}" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "sudo -n /usr/local/bin/deploy-laocai.sh /tmp/laocai-${{ github.sha }}.jar"

      - name: Check service status
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.SERVER_PORT }}" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "systemctl status laocai --no-pager"